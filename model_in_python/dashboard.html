<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Conveyor Digital Twin — Live Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
    body {
        background: #0f1117;
        color: #e5e7eb;
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 24px;
    }
    h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 4px;
    }
    #status-line {
        font-size: 13px;
        color: #9ca3af;
        margin-bottom: 20px;
    }
    .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 12px;
    }
    .badge.ok { background: #064e3b; color: #6ee7b7; }
    .badge.anomaly { background: #7f1d1d; color: #fca5a5; }
    .card {
        background: #171923;
        border: 1px solid #262b3a;
        border-radius: 10px;
        padding: 16px;
        max-width: 900px;
    }
    .card h2 {
        font-size: 14px;
        font-weight: 500;
        color: #9ca3af;
        margin: 0 0 12px 0;
    }
    canvas {
        max-height: 400px;
    }
</style>
</head>
<body>
    <h1>Conveyor Digital Twin — Real vs Model Speed</h1>
    <div id="status-line">
        Status: <span id="status-badge" class="badge ok">--</span>
        &nbsp;|&nbsp; Last update: <span id="last-update">--</span>
    </div>

    <div class="card">
        <h2>Speed (Wr = real, Wm = model)</h2>
        <canvas id="speedChart"></canvas>
    </div>

<script>
const MAX_POINTS = 60;
const POLL_MS = 500;
const DEVIATION_THRESHOLD = 5.0;

const chartOptions = {
    responsive: true,
    animation: false,
    interaction: { mode: 'nearest', intersect: false },
    scales: {
        x: { ticks: { color: '#9ca3af' }, grid: { color: '#262b3a' } },
        y: { ticks: { color: '#9ca3af' }, grid: { color: '#262b3a' } }
    },
    plugins: { legend: { labels: { color: '#e5e7eb' } } }
};

const speedChart = new Chart(document.getElementById('speedChart'), {
    type: 'line',
    data: { labels: [], datasets: [
        { label: 'Wr (real speed)', data: [], borderColor: '#60a5fa', backgroundColor: 'transparent', tension: 0.25, pointRadius: 0 },
        { label: 'Wm (model speed)', data: [], borderColor: '#f59e0b', backgroundColor: 'transparent', tension: 0.25, pointRadius: 0 }
    ]},
    options: chartOptions
});

function fmtTime(unixSeconds) {
    const d = new Date(unixSeconds * 1000);
    return d.toLocaleTimeString();
}

async function backfillHistory() {
    try {
        const resp = await fetch(`/history?n=${MAX_POINTS}`);
        if (!resp.ok) return;
        const data = await resp.json();
        if (!Array.isArray(data) || data.length === 0) return;

        speedChart.data.labels = data.map(d => fmtTime(d.t));
        speedChart.data.datasets[0].data = data.map(d => d.Wr);
        speedChart.data.datasets[1].data = data.map(d => d.Wm);

        updateChartsAndUI(data[data.length - 1]);
    } catch (err) {
        console.error("Backfill failed:", err);
    }
}

async function pollLatest() {
    try {
        const resp = await fetch('/latest');
        if (resp.status === 404) {
            const badge = document.getElementById('status-badge');
            badge.textContent = 'Waiting for data...';
            badge.className = 'badge ok';
            return;
        }
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const entry = await resp.json();
        if (!entry || !entry.t) return;

        const timeStr = fmtTime(entry.t);
        if (speedChart.data.labels.length > 0 && speedChart.data.labels[speedChart.data.labels.length - 1] === timeStr) {
            return;
        }

        speedChart.data.labels.push(timeStr);
        speedChart.data.datasets[0].data.push(entry.Wr);
        speedChart.data.datasets[1].data.push(entry.Wm);

        if (speedChart.data.labels.length > MAX_POINTS) {
            speedChart.data.labels.shift();
            speedChart.data.datasets[0].data.shift();
            speedChart.data.datasets[1].data.shift();
        }

        updateChartsAndUI(entry);
    } catch (err) {
        const badge = document.getElementById('status-badge');
        badge.textContent = 'Server unreachable';
        badge.className = 'badge anomaly';
    }
}

function updateChartsAndUI(latest) {
    speedChart.update('none');

    const badge = document.getElementById('status-badge');

    if (latest.Wm === null || latest.Wm === undefined) {
        badge.textContent = 'No equation loaded yet (Wm unavailable)';
        badge.className = 'badge ok';
    } else {
        const isAnomaly = latest.deviation !== null && latest.deviation > DEVIATION_THRESHOLD;
        badge.textContent = isAnomaly
            ? `ANOMALY (deviation ${latest.deviation.toFixed(2)})`
            : `Nominal (deviation ${latest.deviation !== null ? latest.deviation.toFixed(2) : 'n/a'})`;
        badge.className = 'badge ' + (isAnomaly ? 'anomaly' : 'ok');
    }

    document.getElementById('last-update').textContent = fmtTime(latest.t);
}

async function init() {
    await backfillHistory();
    setInterval(pollLatest, POLL_MS);
}

init();
</script>
</body>
</html>
