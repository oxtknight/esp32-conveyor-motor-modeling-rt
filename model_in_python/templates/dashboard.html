<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Conveyor Digital Twin — Live Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
    * { box-sizing: border-box; }
    body {
        background: #0f1117;
        color: #e5e7eb;
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .container {
        max-width: 1000px;
        width: 100%;
    }
    h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 6px 0;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    .subtitle {
        font-size: 14px;
        color: #9ca3af;
        font-weight: 400;
    }
    #status-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        font-size: 13px;
        color: #9ca3af;
        margin: 8px 0 20px 0;
        padding: 8px 12px;
        background: #1a1d27;
        border-radius: 8px;
        border: 1px solid #262b3a;
    }
    .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 14px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 13px;
    }
    .badge.ok { background: #064e3b; color: #6ee7b7; }
    .badge.anomaly { background: #7f1d1d; color: #fca5a5; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    .metric-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
    }
    .metric-card {
        background: #171923;
        border: 1px solid #262b3a;
        border-radius: 8px;
        padding: 10px 14px;
        text-align: center;
    }
    .metric-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #9ca3af;
    }
    .metric-value {
        font-size: 18px;
        font-weight: 600;
        color: #e5e7eb;
        margin-top: 2px;
        font-variant-numeric: tabular-nums;
    }
    .metric-value.vr { color: #60a5fa; }
    .metric-value.wr { color: #34d399; }
    .metric-value.wm { color: #f59e0b; }
    .metric-value.deviation { color: #f472b6; }

    .card {
        background: #171923;
        border: 1px solid #262b3a;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 20px;
    }
    .card h2 {
        font-size: 14px;
        font-weight: 500;
        color: #9ca3af;
        margin: 0 0 12px 0;
    }
    canvas {
        max-height: 350px;
        width: 100% !important;
    }
    .footer-note {
        font-size: 12px;
        color: #6b7280;
        text-align: center;
        margin-top: 12px;
        border-top: 1px solid #262b3a;
        padding-top: 12px;
    }
</style>
</head>
<body>
<div class="container">
    <h1>
        Conveyor Digital Twin
        <span class="subtitle">Real-time anomaly detection</span>
    </h1>

    <div id="status-line">
        <span>Status: <span id="status-badge" class="badge ok">Waiting for data</span></span>
        <span>Last update: <span id="last-update">--</span></span>
        <span style="margin-left: auto; opacity: 0.6;">Threshold: <span id="threshold-display">5.0</span> RPM</span>
    </div>

    <!-- Live metrics -->
    <div class="metric-grid">
        <div class="metric-card"><div class="metric-label">Voltage (Vr)</div><div class="metric-value vr" id="live-vr">--</div></div>
        <div class="metric-card"><div class="metric-label">Real Speed (Wr)</div><div class="metric-value wr" id="live-wr">--</div></div>
        <div class="metric-card"><div class="metric-label">Model Speed (Wm)</div><div class="metric-value wm" id="live-wm">--</div></div>
        <div class="metric-card"><div class="metric-label">Deviation</div><div class="metric-value deviation" id="live-deviation">--</div></div>
    </div>

    <!-- Chart -->
    <div class="card">
        <h2>Speed (Wr = real, Wm = model)</h2>
        <canvas id="speedChart"></canvas>
    </div>

    <div class="footer-note">
        Polling every 500ms | Data stored in MySQL | Anomaly threshold: <span id="threshold-footer">5.0</span> RPM
    </div>
</div>

<script>
// ======= CONFIG =======
const MAX_POINTS = 60;
const POLL_MS = 500;
const DEVIATION_THRESHOLD = 5.0;

// ======= CHART SETUP =======
const chartOptions = {
    responsive: true,
    maintainAspectRatio: true,
    animation: false,
    interaction: { mode: 'nearest', intersect: false },
    plugins: {
        legend: {
            labels: { color: '#e5e7eb', font: { size: 12 } }
        }
    },
    scales: {
        x: {
            ticks: { color: '#9ca3af', maxTicksLimit: 10 },
            grid: { color: '#262b3a' }
        },
        y: {
            ticks: {
                color: '#9ca3af',
                callback: function(value) { return value + ' RPM'; }
            },
            grid: { color: '#262b3a' }
        }
    }
};

const ctx = document.getElementById('speedChart').getContext('2d');
const speedChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [
            {
                label: 'Wr (real speed)',
                data: [],
                borderColor: '#60a5fa',
                backgroundColor: 'transparent',
                tension: 0.25,
                pointRadius: 0,
                borderWidth: 2
            },
            {
                label: 'Wm (model speed)',
                data: [],
                borderColor: '#f59e0b',
                backgroundColor: 'transparent',
                tension: 0.25,
                pointRadius: 0,
                borderWidth: 2
            }
        ]
    },
    options: chartOptions
});

// ======= DOM REFS =======
const badge = document.getElementById('status-badge');
const lastUpdate = document.getElementById('last-update');
const liveVr = document.getElementById('live-vr');
const liveWr = document.getElementById('live-wr');
const liveWm = document.getElementById('live-wm');
const liveDev = document.getElementById('live-deviation');

function fmtTime(unixSeconds) {
    if (!unixSeconds) return '--';
    return new Date(unixSeconds * 1000).toLocaleTimeString();
}

// ======= BACKFILL =======
async function backfillHistory() {
    try {
        const resp = await fetch(`/history?n=${MAX_POINTS}`);
        if (!resp.ok) return;
        const data = await resp.json();
        if (!data || data.length === 0) return;

        speedChart.data.labels = data.map(d => fmtTime(d.t));
        speedChart.data.datasets[0].data = data.map(d => d.Wr);
        speedChart.data.datasets[1].data = data.map(d => d.Wm);

        updateUI(data[data.length - 1]);
    } catch (e) {
        console.warn('Backfill failed:', e);
    }
}

// ======= POLL =======
async function pollLatest() {
    try {
        const resp = await fetch('/latest');
        if (resp.status === 404) {
            badge.textContent = 'Waiting for data';
            badge.className = 'badge ok';
            return;
        }
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

        const entry = await resp.json();
        if (!entry || !entry.t) return;

        const timeStr = fmtTime(entry.t);
        const lastLabel = speedChart.data.labels[speedChart.data.labels.length - 1];
        if (lastLabel === timeStr) return; // duplicate

        // Add new point
        speedChart.data.labels.push(timeStr);
        speedChart.data.datasets[0].data.push(entry.Wr);
        speedChart.data.datasets[1].data.push(entry.Wm);

        // Trim
        if (speedChart.data.labels.length > MAX_POINTS) {
            speedChart.data.labels.shift();
            speedChart.data.datasets[0].data.shift();
            speedChart.data.datasets[1].data.shift();
        }

        updateUI(entry);
    } catch (e) {
        badge.textContent = 'Server unreachable';
        badge.className = 'badge anomaly';
    }
}

// ======= UPDATE UI =======
function updateUI(entry) {
    // Chart
    speedChart.update('none');

    // Metrics
    liveVr.textContent = entry.Vr !== undefined ? entry.Vr.toFixed(2) : '--';
    liveWr.textContent = entry.Wr !== undefined ? entry.Wr.toFixed(2) : '--';
    liveWm.textContent = entry.Wm !== undefined ? entry.Wm.toFixed(2) : '--';

    const dev = entry.deviation;
    liveDev.textContent = dev !== null && dev !== undefined ? dev.toFixed(2) : '--';
    liveDev.style.color = (dev !== null && dev > DEVIATION_THRESHOLD) ? '#fca5a5' : '#f472b6';

    // Badge & status
    if (entry.Wm === null || entry.Wm === undefined) {
        badge.textContent = 'No model coefficients';
        badge.className = 'badge ok';
    } else {
        const isAnomaly = dev !== null && dev > DEVIATION_THRESHOLD;
        badge.textContent = isAnomaly
            ? 'ANOMALY (dev ' + dev.toFixed(2) + ')'
            : 'Nominal (dev ' + (dev !== null ? dev.toFixed(2) : 'n/a') + ')';
        badge.className = 'badge ' + (isAnomaly ? 'anomaly' : 'ok');
    }

    lastUpdate.textContent = fmtTime(entry.t);

    // Update threshold displays
    document.getElementById('threshold-display').textContent = DEVIATION_THRESHOLD.toFixed(1);
    document.getElementById('threshold-footer').textContent = DEVIATION_THRESHOLD.toFixed(1);
}

// ======= INIT =======
async function init() {
    await backfillHistory();
    setInterval(pollLatest, POLL_MS);
}
init();
</script>
</body>
</html>
